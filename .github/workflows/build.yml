name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      - name: Patch expo Kotlin file
        run: |
          FACTORY_FILE="node_modules/expo/android/src/main/java/expo/modules/ExpoReactHostFactory.kt"
          sed -i '/import com.facebook.react.fabric.ComponentFactory/a import com.facebook.react.fabric.ReactNativeConfig' "$FACTORY_FILE"
          sed -i '/override fun handleInstanceException/i\    override fun getReactNativeConfig(): ReactNativeConfig = ReactNativeConfig.DEFAULT_CONFIG\n' "$FACTORY_FILE"

      - name: Add CrashActivity for debugging
        run: |
          cat > android/app/src/main/java/com/rentalmanager/app/CrashActivity.kt << 'ENDCRASH'
          package com.rentalmanager.app

          import android.app.Activity
          import android.os.Bundle
          import android.widget.ScrollView
          import android.widget.TextView
          import android.graphics.Color
          import android.graphics.Typeface
          import android.text.method.ScrollingMovementMethod

          class CrashActivity : Activity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              val scrollView = ScrollView(this)
              scrollView.setBackgroundColor(Color.parseColor("#1A1A2E"))
              scrollView.setPadding(40, 100, 40, 40)

              val textView = TextView(this)
              textView.setTextColor(Color.parseColor("#FF6B6B"))
              textView.textSize = 13f
              textView.typeface = Typeface.MONOSPACE
              textView.movementMethod = ScrollingMovementMethod()

              val crash = getSharedPreferences("crash_log", MODE_PRIVATE)
                .getString("last_crash", "No crash info available")

              textView.text = "=== RENTAL MANAGER CRASH LOG ===\n\n$crash"
              scrollView.addView(textView)
              setContentView(scrollView)
            }
          }
          ENDCRASH

      - name: Fix MainApplication.kt for RN 0.77 with crash handler
        run: |
          cat > android/app/src/main/java/com/rentalmanager/app/MainApplication.kt << 'ENDOFFILE'
          package com.rentalmanager.app

          import android.app.Application
          import android.content.Context
          import android.content.Intent
          import android.content.res.Configuration

          import com.facebook.react.PackageList
          import com.facebook.react.ReactApplication
          import com.facebook.react.ReactNativeHost
          import com.facebook.react.ReactPackage
          import com.facebook.react.ReactHost
          import com.facebook.react.defaults.DefaultReactNativeHost
          import com.facebook.soloader.SoLoader

          import expo.modules.ApplicationLifecycleDispatcher
          import expo.modules.ReactNativeHostWrapper

          class MainApplication : Application(), ReactApplication {

            override val reactNativeHost: ReactNativeHost = ReactNativeHostWrapper(
              this,
              object : DefaultReactNativeHost(this) {
                override fun getPackages(): List<ReactPackage> =
                  PackageList(this).packages.apply {
                  }

                override fun getJSMainModuleName(): String = ".expo/.virtual-metro-entry"

                override fun getUseDeveloperSupport(): Boolean = BuildConfig.DEBUG

                override val isNewArchEnabled: Boolean = BuildConfig.IS_NEW_ARCHITECTURE_ENABLED
                override val isHermesEnabled: Boolean = true
              }
            )

            override val reactHost: ReactHost
              get() = ReactNativeHostWrapper.createReactHost(applicationContext, reactNativeHost)

            override fun onCreate() {
              // Catch ANY native crash and show it on screen
              val defaultHandler = Thread.getDefaultUncaughtExceptionHandler()
              Thread.setDefaultUncaughtExceptionHandler { thread, throwable ->
                try {
                  val prefs = getSharedPreferences("crash_log", Context.MODE_PRIVATE)
                  val crashText = buildString {
                    appendLine("Thread: ${thread.name}")
                    appendLine("Error: ${throwable.javaClass.simpleName}")
                    appendLine("Message: ${throwable.message}")
                    appendLine("")
                    appendLine("Stack trace:")
                    appendLine(throwable.stackTraceToString())
                    var cause = throwable.cause
                    while (cause != null) {
                      appendLine("")
                      appendLine("Caused by: ${cause.javaClass.simpleName}")
                      appendLine("Message: ${cause.message}")
                      appendLine(cause.stackTraceToString())
                      cause = cause.cause
                    }
                  }
                  prefs.edit().putString("last_crash", crashText).commit()
                  val intent = Intent(this@MainApplication, CrashActivity::class.java)
                  intent.flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TASK
                  startActivity(intent)
                  android.os.Process.killProcess(android.os.Process.myPid())
                } catch (e: Exception) {
                  defaultHandler?.uncaughtException(thread, throwable)
                }
              }

              super.onCreate()
              SoLoader.init(this, false)
              ApplicationLifecycleDispatcher.onApplicationCreate(this)
            }

            override fun onConfigurationChanged(newConfig: Configuration) {
              super.onConfigurationChanged(newConfig)
              ApplicationLifecycleDispatcher.onConfigurationChanged(this, newConfig)
            }
          }
          ENDOFFILE

      - name: Register CrashActivity in AndroidManifest
        run: |
          # Add CrashActivity before the closing </application> tag
          sed -i '/<\/application>/i\        <activity android:name=".CrashActivity" android:exported="false" />' android/app/src/main/AndroidManifest.xml
          echo "=== AndroidManifest.xml ==="
          cat android/app/src/main/AndroidManifest.xml

      - name: Patch build.gradle
        run: |
          sed -i '/enableBundleCompression/d' android/app/build.gradle
          sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/' android/app/build.gradle
          sed -i 's/isShrinkResources = true/isShrinkResources = false/' android/app/build.gradle
          sed -i 's/minifyEnabled true/minifyEnabled false/' android/app/build.gradle
          sed -i 's/shrinkResources true/shrinkResources false/' android/app/build.gradle

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rental-manager-apk
          path: android/app/build/outputs/apk/release/*.apk
