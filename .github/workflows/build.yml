name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      - name: Patch expo Kotlin file
        run: |
          FACTORY_FILE="node_modules/expo/android/src/main/java/expo/modules/ExpoReactHostFactory.kt"
          sed -i '/import com.facebook.react.fabric.ComponentFactory/a import com.facebook.react.fabric.ReactNativeConfig' "$FACTORY_FILE"
          sed -i '/override fun handleInstanceException/i\    override fun getReactNativeConfig(): ReactNativeConfig = ReactNativeConfig.DEFAULT_CONFIG\n' "$FACTORY_FILE"

      - name: Patch build.gradle
        run: sed -i '/enableBundleCompression/d' android/app/build.gradle

      - name: Add crash handler
        run: |
          cat > android/app/src/main/java/com/rentalmanager/app/CrashActivity.kt << 'ENDCRASH'
          package com.rentalmanager.app

          import android.app.Activity
          import android.os.Bundle
          import android.widget.ScrollView
          import android.widget.TextView
          import android.graphics.Color
          import android.graphics.Typeface

          class CrashActivity : Activity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              val scrollView = ScrollView(this)
              scrollView.setBackgroundColor(Color.parseColor("#1A1A2E"))
              scrollView.setPadding(40, 100, 40, 40)
              val textView = TextView(this)
              textView.setTextColor(Color.parseColor("#FF6B6B"))
              textView.textSize = 13f
              textView.typeface = Typeface.MONOSPACE
              val crash = getSharedPreferences("crash_log", MODE_PRIVATE)
                .getString("last_crash", "No crash info")
              textView.text = "=== CRASH LOG ===\n\n$crash"
              scrollView.addView(textView)
              setContentView(scrollView)
            }
          }
          ENDCRASH

          sed -i '/<\/application>/i\        <activity android:name=".CrashActivity" android:exported="false" />' android/app/src/main/AndroidManifest.xml

          MAIN_FILE="android/app/src/main/java/com/rentalmanager/app/MainApplication.kt"
          sed -i '/super.onCreate()/i\    Thread.setDefaultUncaughtExceptionHandler { _, throwable ->\n      try {\n        getSharedPreferences("crash_log", 0).edit().putString("last_crash", throwable.stackTraceToString()).commit()\n        startActivity(android.content.Intent(this@MainApplication, CrashActivity::class.java).setFlags(0x10000000 or 0x04000000))\n        android.os.Process.killProcess(android.os.Process.myPid())\n      } catch (_: Exception) {}\n    }' "$MAIN_FILE"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease 2>&1 | tee build.log; EXIT=${PIPESTATUS[0]}
          echo ""
          echo "=== KOTLIN ERRORS ==="
          grep "^e:" build.log || echo "No Kotlin errors"
          echo "=== BUILD RESULT ==="
          grep "BUILD " build.log
          exit $EXIT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rental-manager-apk
          path: android/app/build/outputs/apk/release/*.apk
