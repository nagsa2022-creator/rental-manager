name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Debug versions
        run: |
          node -e "console.log('expo:', require('./node_modules/expo/package.json').version)"
          node -e "console.log('react-native:', require('./node_modules/react-native/package.json').version)"

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      - name: Patch build.gradle
        run: |
          sed -i '/enableBundleCompression/d' android/app/build.gradle

      - name: Keep crash handler for debugging
        run: |
          cat > android/app/src/main/java/com/rentalmanager/app/CrashActivity.kt << 'ENDCRASH'
          package com.rentalmanager.app

          import android.app.Activity
          import android.os.Bundle
          import android.widget.ScrollView
          import android.widget.TextView
          import android.graphics.Color
          import android.graphics.Typeface

          class CrashActivity : Activity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              val scrollView = ScrollView(this)
              scrollView.setBackgroundColor(Color.parseColor("#1A1A2E"))
              scrollView.setPadding(40, 100, 40, 40)
              val textView = TextView(this)
              textView.setTextColor(Color.parseColor("#FF6B6B"))
              textView.textSize = 13f
              textView.typeface = Typeface.MONOSPACE
              val crash = getSharedPreferences("crash_log", MODE_PRIVATE)
                .getString("last_crash", "No crash info")
              textView.text = "=== CRASH LOG ===\n\n$crash"
              scrollView.addView(textView)
              setContentView(scrollView)
            }
          }
          ENDCRASH

          # Register CrashActivity
          sed -i '/<\/application>/i\        <activity android:name=".CrashActivity" android:exported="false" />' android/app/src/main/AndroidManifest.xml

          # Add crash handler to MainApplication.kt (insert before super.onCreate)
          sed -i '/super.onCreate()/i\    val defaultHandler = Thread.getDefaultUncaughtExceptionHandler()\n    Thread.setDefaultUncaughtExceptionHandler { thread, throwable ->\n      try {\n        val prefs = getSharedPreferences("crash_log", android.content.Context.MODE_PRIVATE)\n        prefs.edit().putString("last_crash", throwable.stackTraceToString()).commit()\n        val intent = android.content.Intent(this@MainApplication, CrashActivity::class.java)\n        intent.flags = android.content.Intent.FLAG_ACTIVITY_NEW_TASK or android.content.Intent.FLAG_ACTIVITY_CLEAR_TASK\n        startActivity(intent)\n        android.os.Process.killProcess(android.os.Process.myPid())\n      } catch (e: Exception) { defaultHandler?.uncaughtException(thread, throwable) }\n    }\n' android/app/src/main/java/com/rentalmanager/app/MainApplication.kt

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rental-manager-apk
          path: android/app/build/outputs/apk/release/*.apk
