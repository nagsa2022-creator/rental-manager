name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      - name: Patch expo Kotlin file
        run: |
          FACTORY_FILE="node_modules/expo/android/src/main/java/expo/modules/ExpoReactHostFactory.kt"
          sed -i '/import com.facebook.react.fabric.ComponentFactory/a import com.facebook.react.fabric.ReactNativeConfig' "$FACTORY_FILE"
          sed -i '/override fun handleInstanceException/i\    override fun getReactNativeConfig(): ReactNativeConfig = ReactNativeConfig.DEFAULT_CONFIG\n' "$FACTORY_FILE"

      - name: Fix MainApplication.kt for RN 0.77
        run: |
          cat > android/app/src/main/java/com/rentalmanager/app/MainApplication.kt << 'KOTLIN'
          package com.rentalmanager.app

          import android.app.Application
          import android.content.res.Configuration
          import com.facebook.react.PackageList
          import com.facebook.react.ReactApplication
          import com.facebook.react.ReactHost
          import com.facebook.react.ReactNativeHost
          import com.facebook.react.ReactPackage
          import com.facebook.react.defaults.DefaultReactHost.getDefaultReactHost
          import com.facebook.react.defaults.DefaultReactNativeHost
          import com.facebook.soloader.SoLoader
          import expo.modules.ApplicationLifecycleDispatcher
          import expo.modules.ReactNativeHostWrapper

          class MainApplication : Application(), ReactApplication {

            override val reactNativeHost: ReactNativeHost =
              ReactNativeHostWrapper(this, object : DefaultReactNativeHost(this) {
                override fun getPackages(): List<ReactPackage> =
                  PackageList(this).packages

                override fun getJSMainModuleName(): String = "index"

                override fun getUseDeveloperSupport(): Boolean = false

                override val isNewArchEnabled: Boolean = false
                override val isHermesEnabled: Boolean = true
              })

            override val reactHost: ReactHost
              get() = getDefaultReactHost(applicationContext, reactNativeHost)

            override fun onCreate() {
              super.onCreate()
              SoLoader.init(this, false)
              ApplicationLifecycleDispatcher.onApplicationCreate(this)
            }

            override fun onConfigurationChanged(newConfig: Configuration) {
              super.onConfigurationChanged(newConfig)
              ApplicationLifecycleDispatcher.onConfigurationChanged(this, newConfig)
            }
          }
          KOTLIN

          echo "=== MainApplication.kt replaced ==="
          cat android/app/src/main/java/com/rentalmanager/app/MainApplication.kt

      - name: Patch build.gradle
        run: sed -i '/enableBundleCompression/d' android/app/build.gradle

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rental-manager-apk
          path: android/app/build/outputs/apk/release/*.apk
