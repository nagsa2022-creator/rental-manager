name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      - name: Debug - show generated MainApplication.kt
        run: |
          echo "=== GENERATED MainApplication.kt ==="
          cat android/app/src/main/java/com/rentalmanager/app/MainApplication.kt

      - name: Patch expo Kotlin file
        run: |
          FACTORY_FILE="node_modules/expo/android/src/main/java/expo/modules/ExpoReactHostFactory.kt"
          sed -i '/import com.facebook.react.fabric.ComponentFactory/a import com.facebook.react.fabric.ReactNativeConfig' "$FACTORY_FILE"
          sed -i '/override fun handleInstanceException/i\    override fun getReactNativeConfig(): ReactNativeConfig = ReactNativeConfig.DEFAULT_CONFIG\n' "$FACTORY_FILE"

      - name: Fix MainApplication.kt for RN 0.77
        run: |
          # Instead of replacing the whole file, patch only the broken references
          FILE="android/app/src/main/java/com/rentalmanager/app/MainApplication.kt"

          echo "=== BEFORE PATCH ==="
          grep -n "ReactNativeApplicationEntryPoint\|ReleaseLevel\|loadReactNative\|SoLoader" "$FILE" || true

          # Replace ReactNativeApplicationEntryPoint import and usage with SoLoader
          sed -i 's/import com.facebook.react.defaults.ReactNativeApplicationEntryPoint/import com.facebook.soloader.SoLoader/' "$FILE"

          # Remove ReleaseLevel import
          sed -i '/import com.facebook.react.defaults.ReleaseLevel/d' "$FILE"

          # Replace the class declaration - remove ReactNativeApplicationEntryPoint interface
          sed -i 's/class MainApplication : Application(), ReactApplication, ReactNativeApplicationEntryPoint/class MainApplication : Application(), ReactApplication/' "$FILE"

          # Replace loadReactNative block with SoLoader.init
          # First remove the entire loadReactNative/releaseLevel block and replace onCreate
          python3 << 'PYFIX'
          import re

          with open("android/app/src/main/java/com/rentalmanager/app/MainApplication.kt", "r") as f:
              content = f.read()

          # Replace the onCreate that uses loadReactNative with SoLoader version
          # Pattern: find onCreate method and replace loadReactNative call
          content = re.sub(
              r'loadReactNative\s*\(.*?\)\s*\{[^}]*\}',
              'SoLoader.init(this, false)',
              content,
              flags=re.DOTALL
          )

          # Remove any remaining releaseLevel/ReleaseLevel references
          content = re.sub(r'.*releaseLevel.*\n', '', content)
          content = re.sub(r'.*ReleaseLevel.*\n', '', content)

          # Remove loadReactNative if still there as standalone call
          content = re.sub(r'\s*loadReactNative\(.*?\)', '\n    SoLoader.init(this, false)', content)

          with open("android/app/src/main/java/com/rentalmanager/app/MainApplication.kt", "w") as f:
              f.write(content)
          PYFIX

          echo "=== AFTER PATCH ==="
          cat "$FILE"

      - name: Patch build.gradle
        run: sed -i '/enableBundleCompression/d' android/app/build.gradle

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rental-manager-apk
          path: android/app/build/outputs/apk/release/*.apk
