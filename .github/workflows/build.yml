name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Debug - show interface we need to implement
        run: |
          echo "=== ReactHostDelegate interface ==="
          cat node_modules/react-native/ReactAndroid/src/main/java/com/facebook/react/runtime/ReactHostDelegate.kt
          echo ""
          echo "=== DefaultReactHostDelegate (reference implementation) ==="
          cat node_modules/react-native/ReactAndroid/src/main/java/com/facebook/react/defaults/DefaultReactHostDelegate.kt

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      - name: Patch expo Kotlin file
        run: |
          # Add the missing getReactNativeConfig override to ExpoReactHostDelegate
          # First show what we're patching
          echo "=== BEFORE PATCH ==="
          grep -n "reactPackages\|ReactHostDelegate\|getReactNativeConfig" node_modules/expo/android/src/main/java/expo/modules/ExpoReactHostFactory.kt || true

          # Insert the missing override before the handleInstanceException method
          sed -i '/override fun handleInstanceException/i\    override val reactNativeConfig: com.facebook.react.ReactNativeConfig\n      get() = com.facebook.react.ReactNativeConfig.DEFAULT\n' \
            node_modules/expo/android/src/main/java/expo/modules/ExpoReactHostFactory.kt

          echo "=== AFTER PATCH ==="
          grep -n "reactNativeConfig\|reactPackages\|handleInstanceException" node_modules/expo/android/src/main/java/expo/modules/ExpoReactHostFactory.kt || true

      - name: Patch build.gradle
        run: sed -i '/enableBundleCompression/d' android/app/build.gradle

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rental-manager-apk
          path: android/app/build/outputs/apk/release/*.apk
